services:
  - type: web
    name: budgetwise
    env: node
    buildCommand: python3 -m pip install --upgrade pip && python3 -m pip install -r ml-service/requirements.txt && python3 -m venv ml-service/.venv && ml-service/.venv/bin/python -m pip install --upgrade pip && ml-service/.venv/bin/pip install -r ml-service/requirements.txt && npm install && npm --prefix server install && npm run build && npm --prefix server run prisma:generate && npm --prefix server run prisma:migrate:deploy
    startCommand: npm --prefix server run start
    healthCheckPath: /api/ml-health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: LOGIN_MAX_ATTEMPTS
        value: 5
      - key: LOGIN_LOCK_MINUTES
        value: 15
      - key: SESSION_IDLE_MINUTES
        value: 15
      - key: START_INTERNAL_ML
        value: 1
      - key: ML_PORT
        value: 5001
      - key: PYTHON_EXECUTABLE
        value: /opt/render/project/src/ml-service/.venv/bin/python
      - key: ML_SERVICE_URL
        value: http://127.0.0.1:5001
      - key: CORS_ORIGINS
        sync: false

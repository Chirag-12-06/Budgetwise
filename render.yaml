services:
  - type: web
    name: budgetwise
    env: node
    buildCommand: npm install && npm --prefix server install && npm run build && npm --prefix server run prisma:generate && npm --prefix server run prisma:migrate:deploy
    startCommand: npm --prefix server run start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: LOGIN_MAX_ATTEMPTS
        value: 5
      - key: LOGIN_LOCK_MINUTES
        value: 15
      - key: SESSION_IDLE_MINUTES
        value: 15
      - key: ML_SERVICE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
